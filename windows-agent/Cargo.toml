[package]
name = "sofapad-agent"
version = "0.3.4"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.30"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
sha2 = "0.10"
getrandom = "0.4"
subtle = "2.6"
mdns-sd = "0.21"
ctrlc = "3.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_Security_Cryptography", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem"] }
